<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem eMedik - Log Masuk Simulasi</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Animasi Garisan (Line Animation) SVG -->
    <style>
        .animated-line-text {
            font-size: 50px; /* Saiz teks 50 */
            font-weight: 800;
            fill: transparent;
            stroke: #ffffff;
            stroke-width: 1.5px;
            stroke-dasharray: 400;
            stroke-dashoffset: 400;
            animation: draw-line 2.5s ease-in-out forwards, fill-color 1s 2s ease-in-out forwards;
        }

        @keyframes draw-line {
            100% {
                stroke-dashoffset: 0;
            }
        }

        @keyframes fill-color {
            100% {
                fill: #ffffff;
                stroke: transparent;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-black flex flex-col items-center justify-center h-screen font-sans selection:bg-gray-500">

    <!-- Animasi Teks eMedik di Luar Kotak Akses -->
    <div class="mb-6 text-center z-20">
        <svg width="250" height="80" viewBox="0 0 250 80">
            <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" class="animated-line-text tracking-wide font-sans">eMedik</text>
        </svg>
    </div>

    <!-- Kotak Pilihan Akses Liquid Glass UI -->
    <div class="bg-white/10 backdrop-blur-xl border border-white/20 p-8 rounded-3xl shadow-2xl w-96 text-center relative z-10">
        
        <div class="space-y-4 mt-2">
            <a href="pemohon/index.html" class="block w-full bg-white/10 hover:bg-white/20 border border-white/30 text-white font-semibold py-3 px-4 rounded-2xl transition duration-300 shadow-lg backdrop-blur-md">
                Akses Pemohon
            </a>
            
            <!-- Akses Pegawai BSM Baharu -->
            <a href="bsm/index.html" class="block w-full bg-blue-900/40 hover:bg-blue-800/50 border border-blue-500/50 text-blue-100 font-semibold py-3 px-4 rounded-2xl transition duration-300 shadow-lg backdrop-blur-md">
                Akses Pegawai BSM
            </a>

            <a href="pelulus/index.html" class="block w-full bg-black/40 hover:bg-black/60 border border-gray-600/50 text-gray-200 font-semibold py-3 px-4 rounded-2xl transition duration-300 shadow-lg backdrop-blur-md">
                Akses Pengguna-Pelulus
            </a>
        </div>

        <div class="mt-8 pt-6 border-t border-white/10">
            <p class="text-xs text-gray-500">eMedik (Fasa 2) &copy; 2026</p>
        </div>
    </div>

</body>
</html>
